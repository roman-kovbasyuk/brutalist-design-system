<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #3A42FF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12.224"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="3.7"
        data-track-index="0"
      ></div>
      <audio
        id="el-01-hook-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="3.2"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-karaoke-body"
        class="scene"
        data-composition-id="02-karaoke-body"
        data-composition-src="compositions/frames/02-karaoke-body.html"
        data-start="3.2"
        data-duration="5.833"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-karaoke-body-voice"
        src="assets/voice/02.wav"
        data-start="3.2"
        data-duration="5.333"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-cta"
        class="scene"
        data-composition-id="03-cta"
        data-composition-src="compositions/frames/03-cta.html"
        data-start="8.533000000000001"
        data-duration="3.691"
        data-track-index="0"
      ></div>
      <audio
        id="el-03-cta-voice"
        src="assets/voice/03.wav"
        data-start="8.533000000000001"
        data-duration="3.691"
        data-track-index="10"
        data-volume="1"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 3.2);
        tl.fromTo("#el-02-karaoke-body", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 3.2);
        tl.to("#el-02-karaoke-body", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 8.533);
        tl.fromTo("#el-03-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 8.533);
        tl.to({}, { duration: 12.224 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
