<!DOCTYPE html>
<!--
  Static banner canvas skeleton for static-banner-design.

  This is a single flat frame, not a HyperFrames composition: no timeline, no `class="clip"`,
  no `data-*` timing attributes, no GSAP. Set <body>'s width/height to the exact target platform
  size (see references/platform-specs.md) and render with:

    npx --yes playwright screenshot --viewport-size=<W>,<H> --wait-for-timeout=400 \
      "file:///<absolute-path>/banner.html" "<output>/banner-<W>x<H>.png"

  Replace every [PLACEHOLDER] before rendering -- grep for "[PLACEHOLDER" as your last pre-render
  check. Brand tokens below mirror marketing-design/assets/brand-tokens.template.css; paste the
  client's real values from there instead of re-deriving them here.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>[PLACEHOLDER: banner name] — [PLACEHOLDER: WxH]</title>
<style>
  :root {
    /* Pull these from the client's brand-tokens.template.css -- do not invent colors here. */
    --color-primary: [PLACEHOLDER: #HEXHEX];
    --color-secondary: [PLACEHOLDER: #HEXHEX];
    --color-accent: [PLACEHOLDER: #HEXHEX];
    --color-background: [PLACEHOLDER: #HEXHEX];
    --color-text: [PLACEHOLDER: #HEXHEX];
    --font-primary: [PLACEHOLDER: "Font Name", fallback-stack];
    --font-display: [PLACEHOLDER: "Display Font Name", fallback-stack];
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1080px;   /* PLACEHOLDER: set to the exact target canvas width */
    height: 1350px;  /* PLACEHOLDER: set to the exact target canvas height */
    overflow: hidden;
    background: var(--color-background);
    color: var(--color-text);
    font-family: var(--font-primary);
  }

  .canvas {
    position: relative;
    width: 100%;
    height: 100%;
  }

  /* Safe-zone guide -- keep essential content inside this box. Delete or comment out this
     element before the final render; it's a visual aid only, not part of the creative. */
  .safe-zone-guide {
    position: absolute;
    top: 10%; left: 5%; right: 5%; bottom: 10%;
    border: 1px dashed rgba(255, 0, 0, 0.35);
    pointer-events: none;
  }

  .zone-headline {
    position: absolute;
    top: 10%; left: 8%; right: 8%;
    font-family: var(--font-display);
    font-size: 64px;
    font-weight: 800;
    line-height: 1.05;
    color: var(--color-text);
  }

  .zone-subhead {
    position: absolute;
    top: 32%; left: 8%; right: 8%;
    font-size: 28px;
    font-weight: 500;
    color: var(--color-text);
    opacity: 0.85;
  }

  .zone-proof {
    position: absolute;
    bottom: 22%; left: 8%; right: 8%;
    font-size: 20px;
    color: var(--color-text);
    opacity: 0.75;
  }

  .zone-cta {
    position: absolute;
    bottom: 8%; left: 8%;
    display: inline-block;
    padding: 18px 36px;
    background: var(--color-accent);
    color: var(--color-background);
    font-weight: 700;
    font-size: 24px;
    border-radius: 999px;
  }

  .zone-logo {
    position: absolute;
    top: 6%; right: 6%;
    height: 48px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="safe-zone-guide"></div>

    <img class="zone-logo" src="[PLACEHOLDER: path/to/logo.svg]" alt="[PLACEHOLDER: brand name]">

    <div class="zone-headline">[PLACEHOLDER: headline copy]</div>
    <div class="zone-subhead">[PLACEHOLDER: subhead copy]</div>
    <div class="zone-proof">[PLACEHOLDER: proof/social-proof line, or delete this element if none]</div>
    <div class="zone-cta">[PLACEHOLDER: CTA text]</div>
  </div>
</body>
</html>
