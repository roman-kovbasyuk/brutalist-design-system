<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура Lingu Studio: от брифа до готового пакета</title>
  <desc id="desc">Маркетолог создаёт бриф, выбирает copy и AI-визуал. Lingu Studio собирает их с опубликованным шаблоном в пакет для проверки дизайнером в Figma. После статуса Ready и подтверждения маркетолога приложение создаёт PNG, MP4 и ZIP.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#3559d6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#8792a5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1b2433; }
      .zone { font-size: 12px; font-weight: 700; letter-spacing: 1.8px; }
      .step { font-size: 13px; font-weight: 700; fill: #3559d6; }
      .title { font-size: 20px; font-weight: 650; }
      .meta { font-size: 13px; fill: #667085; }
      .actor { font-size: 15px; font-weight: 650; }
      .actor-meta { font-size: 12px; fill: #667085; }
      .legend { font-size: 12px; fill: #667085; }
    </style>
  </defs>

  <rect width="1440" height="820" fill="#ffffff"/>

  <g aria-label="Три зоны процесса">
    <rect x="32" y="32" width="654" height="626" rx="16" fill="#f7f8fb" stroke="#dde3ec"/>
    <rect x="702" y="32" width="438" height="626" rx="16" fill="#fffdf4" stroke="#eadb9b"/>
    <rect x="1156" y="32" width="252" height="626" rx="16" fill="#f4faf7" stroke="#bfddcf"/>
    <text class="zone" x="58" y="70" fill="#3559d6">CREATE</text>
    <text class="zone" x="728" y="70" fill="#8a6b00">REVIEW</text>
    <text class="zone" x="1182" y="70" fill="#17734c">DELIVER</text>
  </g>

  <g aria-label="Основной производственный путь">
    <path d="M196 337H216M360 337H380M524 337H544M668 337H716M860 337H880M1024 337H1170M1314 337H1334" fill="none" stroke="#3559d6" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(52 276)">
      <rect width="144" height="122" rx="12" fill="#ffffff" stroke="#c6d0de"/>
      <text class="step" x="18" y="27">01</text><text class="title" x="18" y="59">Brief</text>
      <text class="meta" x="18" y="84">campaign context</text><text class="meta" x="18" y="103">одним текстом</text>
    </g>
    <g transform="translate(216 276)">
      <rect width="144" height="122" rx="12" fill="#ffffff" stroke="#c6d0de"/>
      <text class="step" x="18" y="27">02</text><text class="title" x="18" y="59">Copy</text>
      <text class="meta" x="18" y="84">выбор + ручная</text><text class="meta" x="18" y="103">редактура</text>
    </g>
    <g transform="translate(380 276)">
      <rect width="144" height="122" rx="12" fill="#fff7d8" stroke="#d9bd48"/>
      <text class="step" x="18" y="27" fill="#8a6b00">03</text><text class="title" x="18" y="59">AI assets</text>
      <text class="meta" x="18" y="84">5 визуальных</text><text class="meta" x="18" y="103">направлений</text>
    </g>
    <g transform="translate(544 276)">
      <rect width="124" height="122" rx="12" fill="#ffffff" stroke="#c6d0de"/>
      <text class="step" x="18" y="27">04</text><text class="title" x="18" y="59">Templates</text>
      <text class="meta" x="18" y="84">manifest +</text><text class="meta" x="18" y="103">composition</text>
    </g>
    <g transform="translate(716 276)">
      <rect width="144" height="122" rx="12" fill="#ffffff" stroke="#d9bd48"/>
      <text class="step" x="18" y="27" fill="#8a6b00">05</text><text class="title" x="18" y="59">Review package</text>
      <text class="meta" x="18" y="84">immutable</text><text class="meta" x="18" y="103">snapshot</text>
    </g>
    <g transform="translate(880 276)">
      <rect width="144" height="122" rx="12" fill="#ffffff" stroke="#d9bd48"/>
      <text class="step" x="18" y="27" fill="#8a6b00">06</text><text class="title" x="18" y="59">Figma review</text>
      <text class="meta" x="18" y="84">designer</text><text class="meta" x="18" y="103">quality gate</text>
    </g>
    <g transform="translate(1170 276)">
      <rect width="144" height="122" rx="12" fill="#ffffff" stroke="#81b69c"/>
      <text class="step" x="18" y="27" fill="#17734c">07</text><text class="title" x="18" y="59">Approval</text>
      <text class="meta" x="18" y="84">точный snapshot</text><text class="meta" x="18" y="103">подтверждён</text>
    </g>
    <g transform="translate(1334 276)">
      <rect width="58" height="122" rx="12" fill="#17734c"/>
      <text x="29" y="29" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">08</text>
      <text x="29" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">ZIP</text>
      <text x="29" y="81" text-anchor="middle" font-size="11" fill="#ffffff">PNG</text>
      <text x="29" y="99" text-anchor="middle" font-size="11" fill="#ffffff">MP4</text>
    </g>
  </g>

  <g aria-label="Участники и интеграции">
    <g transform="translate(52 112)">
      <rect width="234" height="92" rx="12" fill="#eef1ff" stroke="#aebbea"/>
      <circle cx="28" cy="30" r="9" fill="#3559d6"/><text class="actor" x="48" y="35">Маркетолог</text>
      <text class="actor-meta" x="20" y="63">задаёт контекст и выбирает</text><text class="actor-meta" x="20" y="79">copy / visual / финальный вариант</text>
    </g>
    <path d="M169 204V258" fill="none" stroke="#8792a5" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-muted)"/>

    <g transform="translate(442 462)">
      <rect width="194" height="88" rx="12" fill="#fff7d8" stroke="#d9bd48"/>
      <circle cx="27" cy="29" r="9" fill="#d7ab00"/><text class="actor" x="47" y="34">Vlad</text>
      <text class="actor-meta" x="20" y="62">публикует versioned</text><text class="actor-meta" x="20" y="78">template manifest</text>
    </g>
    <path d="M539 462V416H606V400" fill="none" stroke="#8792a5" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-muted)"/>

    <g transform="translate(728 112)">
      <rect width="156" height="88" rx="12" fill="#ffffff" stroke="#c6d0de"/>
      <text class="actor" x="20" y="35">Slack</text><text class="actor-meta" x="20" y="62">review assignment</text>
    </g>
    <path d="M806 200V258" fill="none" stroke="#8792a5" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-muted)"/>

    <g transform="translate(916 112)">
      <rect width="196" height="88" rx="12" fill="#ffffff" stroke="#c6d0de"/>
      <circle cx="27" cy="29" r="9" fill="#1b2433"/><text class="actor" x="47" y="34">Дизайнер</text>
      <text class="actor-meta" x="20" y="62">правит stable frames</text><text class="actor-meta" x="20" y="78">и подтверждает качество</text>
    </g>
    <path d="M1014 200V236H952V258" fill="none" stroke="#8792a5" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-muted)"/>

    <g transform="translate(900 462)">
      <rect width="212" height="88" rx="12" fill="#ffffff" stroke="#d9bd48"/>
      <text class="actor" x="20" y="35">Ready webhook</text><text class="actor-meta" x="20" y="62">Ready for Development</text><text class="actor-meta" x="20" y="78">возвращается в приложение</text>
    </g>
    <path d="M1006 462V418H1058V337H1152" fill="none" stroke="#8792a5" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-muted)"/>
  </g>

  <g aria-label="Пояснение" transform="translate(52 708)">
    <text class="zone" x="0" y="0" fill="#667085">LEGEND</text>
    <circle cx="4" cy="37" r="5" fill="#3559d6"/><text class="legend" x="18" y="41">решение человека</text>
    <rect x="181" y="31" width="12" height="12" rx="3" fill="#ffffff" stroke="#3559d6"/><text class="legend" x="204" y="41">шаг приложения</text>
    <rect x="357" y="31" width="12" height="12" rx="3" fill="#fff7d8" stroke="#d9bd48"/><text class="legend" x="380" y="41">AI / review gate</text>
    <path d="M544 37H580" stroke="#8792a5" stroke-width="1.5" stroke-dasharray="5 5"/><text class="legend" x="592" y="41">интеграция или вход</text>
    <text class="legend" x="0" y="79">V1 работает локально с demo-данными; Slack, Figma webhook и provider jobs показаны как integration boundaries.</text>
  </g>
</svg>
