<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background:
            linear-gradient(rgba(2, 9, 189, 0.34), rgba(2, 9, 189, 0.34)),
            linear-gradient(135deg, #3a42ff 0%, #a5a8ff 100%);
          font-family: "Inter", system-ui, sans-serif;
        }

        /* Ambient depth — soft brand-tone glows, low opacity */
        .glow {
          position: absolute;
          border-radius: 50%;
          filter: blur(70px);
          opacity: 0;
        }
        .glow-a {
          width: 620px;
          height: 620px;
          top: -180px;
          left: -160px;
          background: rgba(165, 168, 255, 0.35);
        }
        .glow-b {
          width: 520px;
          height: 520px;
          bottom: -140px;
          right: -140px;
          background: rgba(17, 26, 250, 0.4);
        }

        .logo-badge {
          position: absolute;
          top: 190px;
          left: 50%;
          transform: translateX(-50%) scale(0);
          width: 128px;
          height: 128px;
          border-radius: 999px;
          background: #3b42ea;
          display: grid;
          place-items: center;
          box-shadow: 0 12px 32px rgba(2, 9, 25, 0.28);
          opacity: 0;
        }
        .logo-badge img {
          width: 68px;
          height: 68px;
        }

        .headline-wrap {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 0 108px;
        }
        .headline {
          max-width: 880px;
          text-align: center;
          font-weight: 900;
          font-size: 86px;
          line-height: 1.2;
          letter-spacing: -0.02em;
          color: #ffffff;
        }
        .word {
          display: inline-block;
          opacity: 0;
          transform: scale(0.72) translateY(14px);
          will-change: transform, opacity;
        }
        .word + .word {
          margin-left: 0.24em;
        }
      </style>

      <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
        <div class="glow glow-a" data-layout-allow-overflow></div>
        <div class="glow glow-b" data-layout-allow-overflow></div>

        <div class="logo-badge" id="hook-logo">
          <img src="assets/images/logo-mark.png" alt="" />
        </div>

        <div class="headline-wrap">
          <div class="headline" id="hook-headline">
            <span class="word" data-w="0">You</span>
            <span class="word" data-w="1">know</span>
            <span class="word" data-w="2">that</span>
            <span class="word" data-w="3">moment...</span>
            <span class="word" data-w="4">the</span>
            <span class="word" data-w="5">cashier</span>
            <span class="word" data-w="6">says</span>
            <span class="word" data-w="7">something,</span>
            <span class="word" data-w="8">and</span>
            <span class="word" data-w="9">you</span>
            <span class="word" data-w="10">just</span>
            <span class="word" data-w="11">nod?</span>
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Word-level VO timings (deterministic, character-weighted proportional
        // split of the real audio duration — no local ASR engine was available
        // this session to derive them from an actual transcript alignment).
        const WORDS = [
          { start: 0.0, end: 0.186 },
          { start: 0.231, end: 0.455 },
          { start: 0.5, end: 0.724 },
          { start: 0.769, end: 1.195 },
          { start: 1.24, end: 1.426 },
          { start: 1.471, end: 1.811 },
          { start: 1.856, end: 2.081 },
          { start: 2.126, end: 2.605 },
          { start: 2.65, end: 2.836 },
          { start: 2.881, end: 3.067 },
          { start: 3.112, end: 3.336 },
          { start: 3.381, end: 3.691 },
        ];

        // Glows fade in immediately.
        tl.fromTo(".glow", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0);

        // Logo badge pops in early, small settle.
        tl.fromTo(
          "#hook-logo",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
          0.05,
        );

        // Each word pops in at its VO start time — the kinetic headline IS the
        // burned-in, word-synced caption for this scene.
        WORDS.forEach((w, i) => {
          tl.fromTo(
            `.word[data-w="${i}"]`,
            { opacity: 0, scale: 0.72, y: 14 },
            { opacity: 1, scale: 1, y: 0, duration: 0.22, ease: "power3.out" },
            w.start,
          );
        });

        // Logo "winks" once on the punchline beat — the final word landing.
        tl.to(
          "#hook-logo",
          { scale: 1.16, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 },
          WORDS[11].start,
        );

        window.__timelines["hook"] = tl;
      </script>
    </template>
  </body>
</html>
