<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Fast-Track Norwegian — Variant C: Untangle Schema</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-primary: #3a42ff;
        --color-secondary: #a5a8ff;
        --color-accent: #111afa;
        --color-glass: #0209bd;
        --color-text: #ffffff;
        --color-text-on-light: #060b13;
        --color-text-muted: #ffffff99;
        --gradient-brand: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
        --font-primary: "Inter", system-ui, sans-serif;
        --font-display: "Plus Jakarta Sans", system-ui, sans-serif;
        --radius-pill-label: 20px;
        --radius-pill-panel: 34px;
        --radius-pill-button: 26px;
        --stroke-button: 1px solid rgba(6, 11, 19, 0.15);
        --ease-standard: power2.out;
        --ease-emphasis: back.out(1.5);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: var(--font-primary);
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      /* Persistent brand background — full-bleed CHILD, never the root itself. */
      #bg {
        position: absolute;
        inset: 0;
        background: var(--gradient-brand);
      }

      /* ---------- Scenes (manual-opacity pattern; no class="clip" on scene divs) ---------- */
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #scene-hook {
        opacity: 1;
      }
      #diagram-stage,
      #scene-proof,
      #scene-cta {
        opacity: 0;
      }

      /* ---------- Scene 1: Hook ---------- */
      #hook-inner {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 90px 300px;
      }
      #hook-headline {
        max-width: 940px;
        text-align: center;
        font-family: var(--font-primary);
        font-weight: 800;
        font-size: 76px;
        line-height: 1.24;
        letter-spacing: -0.01em;
        color: var(--color-text);
        text-shadow: 0 8px 32px rgba(6, 11, 19, 0.4);
        opacity: 0;
      }
      .hook-glyph {
        position: absolute;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: rgba(2, 9, 189, 0.55);
        border: 3px dashed rgba(255, 255, 255, 0.6);
        box-shadow: 0 14px 34px rgba(6, 11, 19, 0.3);
        color: rgba(255, 255, 255, 0.95);
        font-family: var(--font-primary);
        font-weight: 700;
        opacity: 0;
        will-change: transform;
      }
      #hook-glyph-q {
        left: 120px;
        top: 470px;
        width: 156px;
        height: 156px;
        font-size: 68px;
      }
      #hook-glyph-a {
        left: 760px;
        top: 1060px;
        width: 200px;
        height: 100px;
        font-size: 42px;
        letter-spacing: 0.08em;
      }
      #hook-glyph-b {
        left: 540px;
        top: 1320px;
        width: 176px;
        height: 90px;
        font-size: 38px;
      }

      /* ---------- Scenes 2+3 merged: Diagram Stage (the rehook set-piece) ---------- */
      #diagram-stage {
        display: grid;
        place-items: center;
      }
      .diagram-caption {
        position: absolute;
        left: 70px;
        right: 70px;
        top: 300px;
        text-align: center;
        font-family: var(--font-primary);
        font-weight: 800;
        font-size: 60px;
        line-height: 1.26;
        letter-spacing: -0.01em;
        color: var(--color-text);
        text-shadow: 0 8px 30px rgba(6, 11, 19, 0.4);
        opacity: 0;
      }
      .connector-svg {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      .conn-broken {
        fill: none;
        stroke: rgba(255, 255, 255, 0.55);
        stroke-width: 4;
        stroke-linecap: round;
        stroke-dasharray: 7 14;
      }
      .conn-solid {
        fill: none;
        stroke: #ffffff;
        stroke-width: 6;
        stroke-linecap: round;
      }
      .dnode {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 264px;
        height: 110px;
        display: grid;
        place-items: center;
        border-radius: 55px;
        transform-origin: 50% 50%;
        will-change: transform;
        opacity: 0;
        background: rgba(2, 9, 189, 0.55);
        border: 3px dashed rgba(255, 255, 255, 0.6);
        box-shadow: 0 16px 38px rgba(6, 11, 19, 0.3);
      }
      .dnode-inner {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 30px;
      }
      .dnode-icon {
        width: 42px;
        height: 42px;
        flex: none;
        opacity: 0.92;
      }
      .dnode-icon svg {
        width: 100%;
        height: 100%;
        fill: none;
        stroke: #ffffff;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .dnode-label {
        font-family: var(--font-primary);
        font-weight: 700;
        font-size: 36px;
        color: var(--color-text);
        opacity: 0;
        white-space: nowrap;
      }
      .dsat {
        position: absolute;
        top: 50%;
        left: 50%;
        display: grid;
        place-items: center;
        will-change: transform;
        opacity: 0;
        color: rgba(255, 255, 255, 0.95);
        font-family: var(--font-primary);
        font-weight: 700;
      }
      #sat-q {
        width: 150px;
        height: 150px;
        border-radius: 999px;
        background: rgba(2, 9, 189, 0.55);
        border: 3px dashed rgba(255, 255, 255, 0.6);
        box-shadow: 0 14px 34px rgba(6, 11, 19, 0.3);
        font-size: 64px;
      }
      #sat-arrow {
        width: 190px;
        height: 86px;
      }
      #sat-arrow svg {
        width: 100%;
        height: 100%;
        fill: none;
        stroke: rgba(255, 255, 255, 0.7);
        stroke-width: 5;
        stroke-dasharray: 7 12;
        stroke-linecap: round;
      }

      /* ---------- Scene 4: Proof ---------- */
      #scene-proof {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
      }
      .proof-badge {
        width: 190px;
        height: 190px;
        border-radius: 999px;
        background: rgba(6, 11, 19, 0.25);
        border: 2px solid rgba(255, 255, 255, 0.35);
        display: grid;
        place-items: center;
        opacity: 0;
        transform: scale(0);
        will-change: transform;
      }
      .proof-badge svg {
        width: 96px;
        height: 96px;
        fill: none;
        stroke: #ffffff;
        stroke-width: 3.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .proof-text {
        text-align: center;
      }
      .proof-line {
        font-family: var(--font-primary);
        font-weight: 700;
        color: var(--color-text);
        opacity: 0;
        will-change: transform;
      }
      #proof-line1 {
        font-size: 52px;
        margin-bottom: 8px;
      }
      #proof-line2 {
        font-size: 44px;
        color: rgba(255, 255, 255, 0.9);
      }

      /* ---------- Scene 5: CTA ---------- */
      #scene-cta {
        display: grid;
        place-items: center;
      }
      .cta-panel {
        width: 860px;
        padding: 56px 60px;
        border-radius: var(--radius-pill-panel);
        background: rgba(2, 9, 189, 0.24);
        backdrop-filter: blur(18px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        opacity: 0;
        will-change: transform;
      }
      .cta-discount {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 76px;
        color: var(--color-text);
      }
      .cta-code {
        font-family: var(--font-display);
        font-weight: 400;
        font-size: 32px;
        color: rgba(255, 255, 255, 0.92);
      }
      .cta-code strong {
        font-weight: 700;
      }
      .cta-button {
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 16px;
        background: #ffffff;
        border: var(--stroke-button);
        border-radius: var(--radius-pill-button);
        padding: 22px 40px;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 34px;
        color: var(--color-text-on-light);
        opacity: 0;
        transform: scale(0.8);
        will-change: transform;
      }
      .cta-button svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: var(--color-text-on-light);
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ---------- Persistent logo lockup ---------- */
      #logo-lockup {
        position: absolute;
        top: 96px;
        left: 50%;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 28px;
        border-radius: var(--radius-pill-label);
        background: #3b42ea;
        opacity: 0;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      #logo-lockup img {
        width: 44px;
        height: 44px;
        display: block;
      }
      #logo-lockup span {
        font-family: var(--font-primary);
        font-weight: 700;
        font-size: 30px;
        color: var(--color-text);
        white-space: nowrap;
      }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="20.2">
      <div id="bg"></div>

      <!-- ================= SCENE 1 — HOOK (0-4s) ================= -->
      <div id="scene-hook" class="scene">
        <div id="hook-inner">
          <h1 id="hook-headline">Your brain, trying to start a conversation on the bus:</h1>
        </div>
        <div class="hook-glyph" id="hook-glyph-q">?</div>
        <div class="hook-glyph" id="hook-glyph-a">···</div>
        <div class="hook-glyph" id="hook-glyph-b">um</div>
      </div>

      <!-- ================= SCENES 2+3 merged — DIAGRAM STAGE (4-14s) ================= -->
      <!-- Frame 2 (scattered/problem) and Frame 3 (rehook/transform) share one persistent
           set of DOM nodes so the "untangle" is a true continuous morph, not a scene cut. -->
      <div id="diagram-stage" class="scene">
        <div class="diagram-caption" id="diagram-cap-1">Words everywhere. No order. No confidence.</div>
        <div class="diagram-caption" id="diagram-cap-2">Fast-Track Norwegian untangles it, one clear path at a time.</div>
        <svg class="connector-svg" viewBox="0 0 1080 1920" data-layout-ignore="true">
          <!-- data-layout-ignore: geometry is authored for each path's own drawn window
               (broken connectors only meaningful during 4-9.55s scatter; solid connectors
               only meaningful once nodes land, ~10.35-11.25s onward) — outside those windows
               the paths are fully hidden via opacity/stroke-dashoffset, so their static `d`
               coordinates legitimately sit far from wherever the (still-scattered) nodes are. -->
          <path class="conn-broken" id="conn-broken-a" d="M 260 810 L 620 620" data-layout-ignore="true" />
          <path class="conn-broken" id="conn-broken-b" d="M 840 680 L 390 1440" data-layout-ignore="true" />
          <path class="conn-solid" id="conn-solid-1" d="M 332 1180 L 408 1180" style="stroke-dasharray: 76; stroke-dashoffset: 76" data-layout-ignore="true" />
          <path class="conn-solid" id="conn-solid-2" d="M 672 1180 L 748 1180" style="stroke-dasharray: 76; stroke-dashoffset: 76" data-layout-ignore="true" />
        </svg>

        <div class="dnode" id="node-1">
          <div class="dnode-inner">
            <span class="dnode-icon">
              <svg viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6" /><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z" /></svg>
            </span>
            <span class="dnode-label" id="node-1-label">Listen</span>
          </div>
        </div>
        <div class="dnode" id="node-2">
          <div class="dnode-inner">
            <span class="dnode-icon">
              <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4" /><path d="M3 11V9a4 4 0 0 1 4-4h14" /><path d="M7 22l-4-4 4-4" /><path d="M21 13v2a4 4 0 0 1-4 4H3" /></svg>
            </span>
            <span class="dnode-label" id="node-2-label">Repeat</span>
          </div>
        </div>
        <div class="dnode" id="node-3">
          <div class="dnode-inner">
            <span class="dnode-icon">
              <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" /></svg>
            </span>
            <span class="dnode-label" id="node-3-label">Speak</span>
          </div>
        </div>

        <div class="dsat" id="sat-q">?</div>
        <div class="dsat" id="sat-arrow">
          <svg viewBox="0 0 150 70"><path d="M10 35 L120 35" /><path d="M100 20 L120 35 L100 50" /></svg>
        </div>
      </div>

      <!-- ================= SCENE 4 — PROOF (14-17s) ================= -->
      <div id="scene-proof" class="scene">
        <div class="proof-badge" id="proof-badge">
          <svg viewBox="0 0 24 24"><path id="check-path" d="M5 13l4 4L19 7" /></svg>
        </div>
        <div class="proof-text">
          <div class="proof-line" id="proof-line1">Real conversations.</div>
          <div class="proof-line" id="proof-line2">In weeks — not years.</div>
        </div>
      </div>

      <!-- ================= SCENE 5 — CTA (17-20.2s) ================= -->
      <div id="scene-cta" class="scene">
        <div class="cta-panel" id="cta-panel">
          <div class="cta-discount">15% off</div>
          <div class="cta-code">with code <strong>FASTTRACK</strong></div>
          <div class="cta-button" id="cta-button">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg>
            <span>Start Today</span>
            <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" /></svg>
          </div>
        </div>
      </div>

      <!-- ================= Persistent brand chrome ================= -->
      <div id="logo-lockup">
        <img src="assets/images/logo-spark.png" alt="" />
        <span>Fast-Track Norwegian</span>
      </div>

      <!-- ================= Voiceover audio (framework-owned playback) ================= -->
      <audio id="voice-l1" src=".media/audio/voice/l1.wav" data-start="0" data-duration="3.008" data-track-index="10"></audio>
      <audio id="voice-l2" src=".media/audio/voice/l2.wav" data-start="4" data-duration="2.709" data-track-index="10"></audio>
      <audio id="voice-l3" src=".media/audio/voice/l3.wav" data-start="9" data-duration="3.797" data-track-index="10"></audio>
      <audio id="voice-l4" src=".media/audio/voice/l4.wav" data-start="14" data-duration="2.773" data-track-index="10"></audio>
      <audio id="voice-l5" src=".media/audio/voice/l5.wav" data-start="17" data-duration="3.029" data-track-index="10"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ============ Persistent logo lockup — pops in once, holds ============ */
      tl.fromTo(
        "#logo-lockup",
        { opacity: 0, scale: 0.82 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        0.15,
      );

      /* ============ Scene 1 — Hook (0-4s) ============ */
      tl.fromTo(
        "#hook-headline",
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.2,
      );
      const HOOK_GLYPHS = [
        { id: "hook-glyph-q", at: 1.3, jx: 14, jy: -11 },
        { id: "hook-glyph-a", at: 1.55, jx: -11, jy: 13 },
        { id: "hook-glyph-b", at: 1.8, jx: 13, jy: -10 },
      ];
      HOOK_GLYPHS.forEach((g) => {
        const glyphEl = document.getElementById(g.id);
        tl.fromTo(
          glyphEl,
          { opacity: 0, scale: 0.6, rotation: -6 },
          { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "power3.out" },
          g.at,
        );
        // finite idle jitter, lands back at 0 offset (even leg count)
        tl.to(glyphEl, { x: g.jx, y: g.jy, duration: 0.55, repeat: 3, yoyo: true, ease: "sine.inOut" }, g.at + 0.5);
      });
      // crossfade OUT of hook / IN of diagram-stage — concurrent at T=4
      tl.to("#scene-hook", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 4.0);
      tl.fromTo("#diagram-stage", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 4.0);

      /* ============ Scenes 2+3 — Diagram Stage: scatter -> untangle (4-14s) ============ */
      const NODES = [
        { id: "node-1", labelId: "node-1-label", baseX: -280, baseY: -150, baseRot: -12, targetX: -340, targetY: 220, jx: 34, jy: 26 },
        { id: "node-2", labelId: "node-2-label", baseX: 300, baseY: -280, baseRot: 9, targetX: 0, targetY: 220, jx: -30, jy: 32 },
        { id: "node-3", labelId: "node-3-label", baseX: -150, baseY: 480, baseRot: 14, targetX: 340, targetY: 220, jx: 28, jy: -34 },
      ];
      const SCATTER_ENTRY_AT = 4.0;
      const JITTER_START = 4.5;
      const JITTER_LEG_DUR = 1.1;
      const JITTER_REPEAT = 3; // 4 legs (even) -> lands back at base offset, no jump
      const TRANSFORM_START = 9.2;
      const MOVE_STAGGER = 0.12;
      const MOVE_DUR = 1.0;

      NODES.forEach((n, i) => {
        const nodeEl = document.getElementById(n.id);
        const labelEl = document.getElementById(n.labelId);
        const iconEl = nodeEl.querySelector(".dnode-icon");
        gsap.set(nodeEl, { xPercent: -50, yPercent: -50 });
        // 1) entrance pop into the scattered position (fromTo — correct at t=0 under seek)
        tl.fromTo(
          nodeEl,
          { x: n.baseX, y: n.baseY, rotation: n.baseRot, opacity: 0, scale: 0.8 },
          { x: n.baseX, y: n.baseY, rotation: n.baseRot, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
          SCATTER_ENTRY_AT,
        );
        // 2) finite idle jitter around the scattered position — ends exactly back at base
        tl.to(
          nodeEl,
          { x: n.baseX + n.jx, y: n.baseY + n.jy, duration: JITTER_LEG_DUR, repeat: JITTER_REPEAT, yoyo: true, ease: "sine.inOut" },
          JITTER_START,
        );
        // 3) THE MORPH — same element tweens from scattered position to its ordered slot
        const moveAt = TRANSFORM_START + i * MOVE_STAGGER;
        tl.to(
          nodeEl,
          { x: n.targetX, y: n.targetY, rotation: 0, duration: MOVE_DUR, ease: "back.out(1.5)" },
          moveAt,
        );
        // capsule resolves from "unformed" ghost chrome to solid brand pill as it lands
        tl.to(
          nodeEl,
          { backgroundColor: "#3b42ea", borderColor: "rgba(59,66,234,0)", duration: MOVE_DUR * 0.6, ease: "power1.out" },
          moveAt + MOVE_DUR * 0.35,
        );
        // icon brightens
        tl.to(iconEl, { opacity: 1, duration: 0.4, ease: "power1.out" }, moveAt + MOVE_DUR * 0.5);
        // label reveals as the node arrives
        tl.to(labelEl, { opacity: 1, duration: 0.4, ease: "power1.out" }, moveAt + MOVE_DUR * 0.6);
      });

      // satellites: pop in with the scatter, dissolve away the instant order arrives
      tl.fromTo("#sat-q", { xPercent: -50, yPercent: -50, x: 80, y: -340, opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, SCATTER_ENTRY_AT + 0.15);
      tl.to("#sat-q", { x: 80 + 18, y: -340 - 16, duration: 1.2, repeat: 3, yoyo: true, ease: "sine.inOut" }, JITTER_START + 0.2);
      tl.to("#sat-q", { opacity: 0, duration: 0.4, ease: "power1.in" }, TRANSFORM_START);

      tl.fromTo("#sat-arrow", { xPercent: -50, yPercent: -50, x: 260, y: 560, opacity: 0, scale: 0.7, rotation: 8 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, SCATTER_ENTRY_AT + 0.3);
      tl.to("#sat-arrow", { x: 260 - 20, y: 560 + 14, duration: 1.0, repeat: 3, yoyo: true, ease: "sine.inOut" }, JITTER_START + 0.35);
      tl.to("#sat-arrow", { opacity: 0, duration: 0.4, ease: "power1.in" }, TRANSFORM_START + 0.15);

      // broken connectors visible through scatter, fade as order arrives
      tl.set(["#conn-broken-a", "#conn-broken-b"], { opacity: 0.4 }, SCATTER_ENTRY_AT);
      tl.to(["#conn-broken-a", "#conn-broken-b"], { opacity: 0, duration: 0.35, ease: "power1.in" }, TRANSFORM_START);

      // solid connectors draw in once their endpoint nodes have essentially landed
      const CONN1_AT = TRANSFORM_START + MOVE_DUR + 0.15; // ~10.35
      const CONN2_AT = CONN1_AT + MOVE_DUR * 0.4; // staggered ~80% of prior segment
      tl.to("#conn-solid-1", { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, CONN1_AT);
      tl.to("#conn-solid-2", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, CONN2_AT);

      // diagram-stage captions — bold hero-headline treatment, crossfades as the morph begins
      tl.fromTo("#diagram-cap-1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, SCATTER_ENTRY_AT + 0.2);
      tl.to("#diagram-cap-1", { opacity: 0, duration: 0.35, ease: "power1.in" }, TRANSFORM_START - 0.35);
      tl.fromTo("#diagram-cap-2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, TRANSFORM_START);

      // crossfade OUT of diagram-stage / IN of proof — concurrent at T=14
      tl.to("#diagram-stage", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 14.0);
      tl.fromTo("#scene-proof", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 14.0);

      /* ============ Scene 4 — Proof (14-17s) ============ */
      tl.fromTo("#proof-badge", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 14.2);
      // checkmark stroke draw
      tl.to("#check-path", { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 14.4);
      tl.fromTo("#proof-line1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 14.6);
      tl.fromTo("#proof-line2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 14.75);

      // crossfade OUT of proof / IN of cta — concurrent at T=17
      tl.to("#scene-proof", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 17.0);
      tl.fromTo("#scene-cta", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 17.0);

      /* ============ Scene 5 — CTA (17-20.2s) ============ */
      tl.fromTo(
        "#cta-panel",
        { opacity: 0, y: 120 },
        { opacity: 1, y: 0, duration: 0.6, ease: "back.out(1.5)" },
        17.3,
      );
      tl.fromTo(
        "#cta-button",
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" },
        17.9,
      );

      // set initial SVG stroke lengths for the checkmark at composition setup
      (function setupCheckPath() {
        const p = document.getElementById("check-path");
        const len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      })();

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
