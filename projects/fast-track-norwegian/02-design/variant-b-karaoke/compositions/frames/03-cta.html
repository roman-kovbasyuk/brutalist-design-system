      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // logo-assemble-lockup (Adapt): the lockup settles in first, then the promo panel's
        // elements settle in turn — each landing on its real TTS word timestamp
        // (audio_meta.json frame 3 words[]): Fast-Track(0-.58) Norwegian.(.58-1.14)
        // 15%(1.66-2.24) off(2.24-2.46) with(2.46-2.68) code(2.68-2.94) FASTTRACK.(2.94-3.46)
        tl.fromTo(
          "#label-pill",
          { autoAlpha: 0, y: -24 },
          { autoAlpha: 1, y: 0, duration: 0.4, ease: "back.out(1.5)" },
          0,
        );

        // Promo panel container itself: one settle-in as the VO reaches "15%".
        tl.fromTo(
          "#promo-panel",
          { autoAlpha: 0, y: 24 },
          { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" },
          1.66,
        );
        tl.fromTo(
          "#price-line",
          { autoAlpha: 0, scale: 0.92 },
          { autoAlpha: 1, scale: 1, duration: 0.4, ease: "back.out(1.4)" },
          1.66,
        );

        // Code line + CTA button land together as the VO says "with code FASTTRACK".
        tl.fromTo(
          "#code-line",
          { autoAlpha: 0, y: 12 },
          { autoAlpha: 1, y: 0, duration: 0.3, ease: "power2.out" },
          2.46,
        );
        tl.fromTo(
          "#cta-button",
          { autoAlpha: 0, y: 12 },
          { autoAlpha: 1, y: 0, duration: 0.3, ease: "power2.out" },
          2.46,
        );

        // Settle-and-hold to the end — this is the final frame; no exit tween.

        window.__timelines["03-cta"] = tl;
