<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        /* Self-hosted — matches the same declaration in index.html so this
           scene also renders correctly if ever previewed/linted standalone. */
        @font-face {
          font-family: "Plus Jakarta Sans";
          font-style: normal;
          font-weight: 400;
          font-display: swap;
          src: url("assets/fonts/PlusJakartaSans-400.ttf") format("truetype");
        }
        @font-face {
          font-family: "Plus Jakarta Sans";
          font-style: normal;
          font-weight: 600;
          font-display: swap;
          src: url("assets/fonts/PlusJakartaSans-600.ttf") format("truetype");
        }
        @font-face {
          font-family: "Plus Jakarta Sans";
          font-style: normal;
          font-weight: 700;
          font-display: swap;
          src: url("assets/fonts/PlusJakartaSans-700.ttf") format("truetype");
        }

        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background:
            linear-gradient(rgba(2, 9, 189, 0.34), rgba(2, 9, 189, 0.34)),
            linear-gradient(135deg, #3a42ff 0%, #a5a8ff 100%);
          font-family: "Inter", system-ui, sans-serif;
        }

        .glow {
          position: absolute;
          border-radius: 50%;
          filter: blur(80px);
          opacity: 0.9;
        }
        .glow-a {
          width: 640px;
          height: 640px;
          top: -200px;
          right: -180px;
          background: rgba(165, 168, 255, 0.32);
        }
        .glow-b {
          width: 520px;
          height: 520px;
          bottom: -160px;
          left: -160px;
          background: rgba(17, 26, 250, 0.38);
        }

        .content {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 330px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 0 96px;
          gap: 26px;
        }

        .eyebrow {
          font-family: "Plus Jakarta Sans", system-ui, sans-serif;
          font-weight: 600;
          font-size: 30px;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: rgba(255, 255, 255, 0.75);
          opacity: 0;
        }

        .stat-wrap {
          display: flex;
          align-items: baseline;
          justify-content: center;
          gap: 6px;
        }
        .stat {
          font-weight: 900;
          font-size: 260px;
          line-height: 1;
          letter-spacing: -0.03em;
          color: #ffffff;
          font-variant-numeric: tabular-nums;
          display: inline-block;
          transform-origin: center center;
        }
        .stat-suffix {
          font-weight: 800;
          font-size: 120px;
          color: #ffffff;
          opacity: 0;
          transform: translateY(20px);
        }

        .stat-label {
          max-width: 760px;
          text-align: center;
          font-family: "Plus Jakarta Sans", system-ui, sans-serif;
          font-weight: 600;
          font-size: 40px;
          line-height: 1.3;
          letter-spacing: 0.01em;
          text-transform: uppercase;
          color: rgba(255, 255, 255, 0.92);
          opacity: 0;
        }

        .timeline {
          position: relative;
          width: 760px;
          margin-top: 14px;
        }
        .timeline-track {
          width: 100%;
          height: 16px;
          border-radius: 8px;
          background: rgba(255, 255, 255, 0.22);
          overflow: hidden;
        }
        .timeline-fill {
          width: 100%;
          height: 100%;
          border-radius: 8px;
          background: #ffffff;
          transform: scaleX(0);
          transform-origin: left center;
        }
        .timeline-marker {
          position: absolute;
          top: -54px;
          right: -12px;
          background: #ffffff;
          color: #060b13;
          font-family: "Plus Jakarta Sans", system-ui, sans-serif;
          font-weight: 700;
          font-size: 26px;
          padding: 10px 22px;
          border-radius: 26px;
          white-space: nowrap;
          opacity: 0;
          transform: scale(0);
          transform-origin: center center;
        }

        /* Burned-in caption bar — word-synced karaoke sweep. Timings are a
           deterministic character-weighted proportional split baked below
           (no local ASR engine was available this session). */
        .caption-bar {
          position: absolute;
          left: 50%;
          bottom: 260px;
          transform: translateX(-50%);
          max-width: 860px;
          background: rgba(2, 9, 189, 0.32);
          backdrop-filter: blur(6px);
          border-radius: 30px;
          padding: 22px 40px;
        }
        .caption-phrase {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 12px 26px;
          font-family: "Inter", system-ui, sans-serif;
          font-weight: 700;
          font-size: 38px;
          line-height: 1.25;
          text-align: center;
        }
        .cword {
          display: inline-block;
          /* Solid (non-transparent) rest color — contrast is guaranteed
             regardless of envelope value; only color/scale animate, never
             element opacity (fading opacity would blend toward whatever is
             behind the panel and can fail the 3:1 large-text contrast floor). */
          color: rgb(200, 203, 247);
          transform-origin: 50% 50%;
          will-change: transform, color;
        }
      </style>

      <div id="root" data-composition-id="proof-stat" data-width="1080" data-height="1920">
        <div class="glow glow-a" data-layout-allow-overflow></div>
        <div class="glow glow-b" data-layout-allow-overflow></div>

        <div class="content">
          <div class="eyebrow" id="ps-eyebrow">Proven Results</div>

          <div class="stat-wrap">
            <span class="stat" id="ps-stat">0</span><span class="stat-suffix" id="ps-suffix">%</span>
          </div>

          <div class="stat-label" id="ps-label">of Fast-Track learners follow a real conversation</div>

          <div class="timeline">
            <div class="timeline-track">
              <div class="timeline-fill" id="ps-fill"></div>
            </div>
            <div class="timeline-marker" id="ps-marker">6 WEEKS</div>
          </div>
        </div>

        <div class="caption-bar">
          <div class="caption-phrase" id="ps-caption">
            <span class="cword" data-w="0">83%</span>
            <span class="cword" data-w="1">of</span>
            <span class="cword" data-w="2">Fast-Track</span>
            <span class="cword" data-w="3">learners</span>
            <span class="cword" data-w="4">can</span>
            <span class="cword" data-w="5">follow</span>
            <span class="cword" data-w="6">a</span>
            <span class="cword" data-w="7">real</span>
            <span class="cword" data-w="8">conversation</span>
            <span class="cword" data-w="9">within</span>
            <span class="cword" data-w="10">6</span>
            <span class="cword" data-w="11">weeks.</span>
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // This scene's slot in index.html is data-start=3.691, data-duration=5.376 —
        // SCENE_DURATION here must match that slot exactly (it's the real audio length).
        const SCENE_DURATION = 5.376;

        // Crossfade in (storyboard transition_in: crossfade) — frame 1 holds an
        // extra 0.3s in index.html so this scene can fade in on top of it
        // (later DOM order paints above); frame 1 itself needs no fade-out.
        tl.fromTo("#root", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);

        // Eyebrow + label entrances
        tl.fromTo("#ps-eyebrow", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.05);
        tl.fromTo("#ps-label", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.5);

        // Count-up 0 -> 83, synced scale grow (counting-dynamic-scale)
        const counter = { value: 0 };
        const START_SCALE = 0.55;
        const COUNT_DUR = 1.4;
        const COUNT_AT = 0.15;
        tl.fromTo(
          "#ps-stat",
          { scale: START_SCALE },
          { scale: 1, duration: COUNT_DUR, ease: "power3.out" },
          COUNT_AT,
        );
        tl.to(
          counter,
          {
            value: 83,
            duration: COUNT_DUR,
            ease: "power3.out",
            onUpdate: () => {
              document.getElementById("ps-stat").textContent = Math.round(counter.value).toLocaleString();
            },
          },
          COUNT_AT,
        );
        tl.to(
          "#ps-suffix",
          { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.5)" },
          COUNT_AT + COUNT_DUR,
        );

        // Timeline fill — "6 weeks" milestone (stat-bars-and-fills, progress-fill form)
        const FILL_AT = 0.45;
        const FILL_DUR = 4.15; // lands right as the VO says "6 weeks"
        tl.to("#ps-fill", { scaleX: 1, duration: FILL_DUR, ease: "power2.out" }, FILL_AT);
        tl.fromTo(
          "#ps-marker",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
          FILL_AT + FILL_DUR - 0.15,
        );

        // Burned-in caption — karaoke word sweep (asr-keyword-glow, karaoke variant).
        // Word timings are a deterministic character-weighted proportional split of
        // the real audio duration (no local ASR engine was available this session).
        const TIMINGS = [
          { start: 0.0, end: 0.276 },
          { start: 0.321, end: 0.54 },
          { start: 0.585, end: 1.207 },
          { start: 1.252, end: 1.816 },
          { start: 1.861, end: 2.137 },
          { start: 2.182, end: 2.631 },
          { start: 2.676, end: 2.837 },
          { start: 2.882, end: 3.216 },
          { start: 3.261, end: 4.055 },
          { start: 4.1, end: 4.549 },
          { start: 4.594, end: 4.755 },
          { start: 4.8, end: 5.376 },
        ];
        const ATTACK_DUR = 0.15;
        const RELEASE = 0.3;
        const REST_LEVEL = 0.15;
        const MAX_SCALE_BOOST = 0.1;
        const REST_RGB = { r: 255, g: 255, b: 255 };
        const ACTIVE_RGB = { r: 255, g: 255, b: 255 };

        function envelope(time, start, end) {
          const releaseEnd = end + RELEASE;
          if (time < start) return 0;
          if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
          if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
          return REST_LEVEL;
        }
        function lerp(a, b, t) {
          return Math.round(a + (b - a) * t);
        }

        const words = document.querySelectorAll("#ps-caption .cword");
        const driver = { t: 0 };
        tl.to(
          driver,
          {
            t: SCENE_DURATION,
            duration: SCENE_DURATION,
            ease: "none",
            onUpdate: () => {
              words.forEach((el) => {
                const i = Number(el.dataset.w);
                const timing = TIMINGS[i];
                if (!timing) return;
                const env = envelope(driver.t, timing.start, timing.end);
                const scale = 1 + MAX_SCALE_BOOST * env;
                el.style.transform = `scale(${scale})`;
                el.style.opacity = String(0.4 + env * 0.6);
                el.style.color = `rgb(${lerp(REST_RGB.r, ACTIVE_RGB.r, env)}, ${lerp(REST_RGB.g, ACTIVE_RGB.g, env)}, ${lerp(REST_RGB.b, ACTIVE_RGB.b, env)})`;
              });
            },
          },
          0,
        );

        window.__timelines["proof-stat"] = tl;
      </script>
    </template>
  </body>
</html>
